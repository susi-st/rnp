<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>學生資料查詢系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: "Inter", "sans-serif", "Microsoft JhengHei"; }
        .student-block.selected, .violation-block.selected {
            transform: scale(1.05);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            z-index: 10;
        }
        .editable-field {
            padding: 0.25rem 0.5rem;
            border: 1px solid #D1D5DB;
            border-radius: 0.375rem;
            background-color: white;
            font-size: 0.875rem;
            line-height: 1.25rem;
            outline: none;
        }
        .editable-field:focus {
            border-color: #3B82F6;
            ring: 2px;
            ring-color: #BFDBFE;
        }
        .editable-reason-field { width: 100%; margin-top: 0.25rem; }
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-4 md:p-8">
    <div class="max-w-6xl mx-auto bg-white rounded-2xl shadow-xl p-6 md:p-8">
        <h1 class="text-3xl font-bold text-center text-gray-800 mb-6">學生資料查詢系統</h1>

        <!-- 1. 年級選擇區 -->
        <div id="grade-selection" class="border-b border-gray-200 pb-6 mb-6">
            <h2 class="text-xl font-semibold text-gray-700 mb-4">1. 選擇年級</h2>
            <div id="grade-buttons" class="flex flex-wrap gap-3 justify-center">
                <button data-grade="7" onclick="showClassButtons(7, this)" class="grade-btn text-white font-bold py-3 px-6 rounded-lg shadow-md transition bg-blue-500 hover:bg-blue-600 focus:outline-none focus:ring-4 focus:ring-blue-300">七年級</button>
                <button data-grade="8" onclick="showClassButtons(8, this)" class="grade-btn text-white font-bold py-3 px-6 rounded-lg shadow-md transition bg-green-500 hover:bg-green-600 focus:outline-none focus:ring-4 focus:ring-green-300">八年級</button>
                <button data-grade="9" onclick="showClassButtons(9, this)" class="grade-btn text-white font-bold py-3 px-6 rounded-lg shadow-md transition bg-indigo-500 hover:bg-indigo-600 focus:outline-none focus:ring-4 focus:ring-indigo-300">九年級</button>
            </div>
        </div>

        <!-- 2. 班級選擇區 -->
        <div id="class-selection" class="border-b border-gray-200 pb-6 mb-6">
            <h2 class="text-xl font-semibold text-gray-700 mb-4">2. 選擇班級</h2>
            <div id="class-buttons" class="grid grid-cols-5 md:grid-cols-10 gap-2">
                <p id="class-placeholder" class="text-gray-500 col-span-full">請先選擇一個年級</p>
            </div>
        </div>

        <!-- 3. 學生顯示區 -->
        <div id="student-display-area" class="border-b border-gray-200 pb-6 mb-6">
            <h2 class="text-xl font-semibold text-gray-700 mb-4">3. 學生名單</h2>
            <div id="message-area" class="text-center text-gray-600 mb-4"><p>請選擇班級以顯示學生名單。</p></div>
            <div id="student-display" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 lg:grid-cols-8 gap-3"></div>
        </div>

        <!-- 4. 獎懲條款選擇區 -->
        <div id="violation-section" class="border-b border-gray-200 pb-6 mb-6">
            <h2 class="text-xl font-semibold text-gray-700 mb-4">4. 選擇獎懲條款</h2>
            <div id="violation-type-buttons" class="flex flex-wrap gap-3 justify-center mb-6">
                <button id="btn-type-merit" data-type="merit" onclick="showViolationClauses('merit', this)" class="violation-type-btn text-white font-bold py-3 px-6 rounded-lg shadow-md transition bg-emerald-500 hover:bg-emerald-600 focus:ring-4 focus:ring-emerald-300">嘉獎</button>
                <button id="btn-type-warning" data-type="warning" onclick="showViolationClauses('warning', this)" class="violation-type-btn text-white font-bold py-3 px-6 rounded-lg shadow-md transition bg-yellow-500 hover:bg-yellow-600 focus:ring-4 focus:ring-yellow-300">警告</button>
                <button id="btn-type-minorDemerit" data-type="minorDemerit" onclick="showViolationClauses('minorDemerit', this)" class="violation-type-btn text-white font-bold py-3 px-6 rounded-lg shadow-md transition bg-orange-500 hover:bg-orange-600 focus:ring-4 focus:ring-orange-300">小過</button>
                <button id="btn-type-majorDemerit" data-type="majorDemerit" onclick="showViolationClauses('majorDemerit', this)" class="violation-type-btn text-white font-bold py-3 px-6 rounded-lg shadow-md transition bg-red-500 hover:bg-red-600 focus:ring-4 focus:ring-red-300">大過</button>
                <button id="btn-type-special" data-type="special" onclick="showViolationClauses('special', this)" class="violation-type-btn text-white font-bold py-3 px-6 rounded-lg shadow-md transition bg-purple-600 hover:bg-purple-700 focus:ring-4 focus:ring-purple-300">特別處罰</button>
            </div>
            <div id="violation-display" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                <p id="violation-placeholder" class="text-gray-500 col-span-full text-center">請選擇一個類別以顯示條款</p>
            </div>
        </div>

        <!-- 5. 產生資料區 -->
        <div id="generation-section" class="hidden">
            <h2 class="text-xl font-semibold text-gray-700 mb-4">5. 產生資料與同步</h2>
            <div class="flex flex-col items-center">
                
                <div id="webapp-url-container" class="w-full mb-6 p-4 bg-gray-50 rounded-lg border border-gray-200">
                    <label for="webapp-url" class="block text-sm font-medium text-gray-700 mb-1">Google Apps Script 網址:</label>
                    <input type="text" id="webapp-url" class="w-full p-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500 text-sm" onchange="saveWebAppUrl(this.value)">
                </div>

                <div class="flex flex-wrap gap-4 mb-4">
                    <button id="generate-button" onclick="generateOutput()" class="text-white font-bold py-3 px-6 rounded-lg shadow-md transition bg-blue-600 hover:bg-blue-700">產生 / 更新資料</button>
                    <button id="copy-button" onclick="copyAndSendToSheet()" disabled class="text-white font-bold py-3 px-6 rounded-lg shadow-md bg-gray-400 cursor-not-allowed">複製並同步傳送至試算表</button>
                </div>
                <p id="output-message" class="text-gray-600 mb-2 text-sm font-medium h-6 text-center"></p>
                <div id="output-rows-container" class="w-full space-y-3"></div>
            </div>
        </div>
    </div>

    <script>
        const PRE_CONFIGURED_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyHX4v1oPaY6z_Ug0GuXyFkEBkVhW7tiQiGPdYhlRjxFH8b8-NEmRybKa1fFgs2iFh8/exec"; 
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQuMBC2TB053KqVVItRTQuHjfJ0OY-7SACLO1_CRPbw2a6Je9DXiuRnA6yiNXOTdKKB-mt9T1t84bQy/pub?gid=178152608&single=true&output=csv';
        
        let allStudentData = [];
        let urlNote = "";
        const SAVED_URL_KEY = 'student_system_webapp_url';

        const classButtonsContainer = document.getElementById('class-buttons');
        const studentDisplayContainer = document.getElementById('student-display');
        const messageArea = document.getElementById('message-area');
        const classPlaceholder = document.getElementById('class-placeholder');
        const violationDisplayContainer = document.getElementById('violation-display');
        const violationPlaceholder = document.getElementById('violation-placeholder');
        const outputRowsContainer = document.getElementById('output-rows-container');
        const outputMessage = document.getElementById('output-message');
        const webappUrlInput = document.getElementById('webapp-url');
        const webappUrlContainer = document.getElementById('webapp-url-container');
        const generationSection = document.getElementById('generation-section');
        const copyButton = document.getElementById('copy-button');

        const violationData = {
            merit: [
                "1. 服裝儀容經常整潔，合於規定，足為同學模範者。", "2. 禮儀周到足為同學模範者。", "3. 參加團體活動確有成績表現者。", "4. 節儉樸素足為同學模範者。", "5. 與同學互助合作者。", "6. 值勤特別盡職者。", "7. 主動為公服務者。", "8. 勸告同學向善者。", "9. 運動比賽時體育道德表現優良者。", "10. 領導同學為團體服務者。", "11. 愛護公物有具體事蹟者。", "12. 生活言行較前進步，有事實表現者。", "13. 在車船上讓座師長、老弱、婦孺者。", "14. 其他優良行為合於記嘉獎者。"
            ],
            warning: [
                "1. 參加公眾或團體活動等，影響活動秩序、活動進行或他人權益，情節輕微。", "2. 言行涉及公然侮辱、誹謗或恐嚇，情節輕微。", "3. 拾物不送招領，據為己有，情節輕微。", "4. 值勤未盡職責，影響他人權益或工作之推動。", "5. 因過失毀損公物而不主動報告。", "6. 故意毀損公物，情節輕微。", "7. 違反著作權法，情節輕微。", "8. 在公共場所高聲喧嚷影響秩序。", "9. 未經同意偷窺他人訊息或文件，情節輕微。", "10. 未遵守道路交通安全規則，情節輕微。", "11. 違反上課規定，影響教學秩序或他人學習，屢勸不聽。", "12. 攜帶或使用違法或違禁物品，情節輕微。", "13. 亂丟垃圾或其他破壞環境衛生行為，經勸導仍未改正。", "14. 以不實言論誤導師長，致未能妥善處理事件。", "15. 不服從師長 or 糾察隊 or 幹部因執行公務之糾正，情節輕微。", "16. 違反學校校園行動載具使用管理規範，情節輕微。"
            ],
            minorDemerit: [
                "1. 參加公眾或團體活動，影響活動秩序，經勸導仍未改正。", "2. 言行涉及公然侮辱、誹謗或恐嚇，經糾正仍未改正。", "3. 拾物不送招領，據為己有，情節重大。", "4. 擔任班級幹部未盡職責，影響工作推展，情節重大。", "5. 故意毀損公物，屢勸仍再犯且情節尚非重大。", "6. 違反著作權法，屢勸仍再犯且情節尚非重大。", "7. 蓄意違反集會秩序，影響他人權益或集會之進行。", "8. 未經同意偷窺並散播他人訊息或文件。", "9. 賭博行為，情節輕微。", "10. 未遵守道路交通安全規則，經糾正仍未改正或情節重大。", "11. 毆打他人，情節輕微。", "12. 攜帶或使用違法或違禁物品，屢勸仍再犯且情節尚非重大。", "13. 竊盜行為，情節輕微。", "14. 不假離校(宿舍)外出。", "15. 不服從師長 or 糾察隊 or 幹部因執行公務之糾正，情節重大。", "16. 違反學校校園行動載具使用管理規範，情節重大。", "17. 吸菸、嚼檳榔、飲用酒類或其他有礙身心健康之物品，經查明屬實且情節輕微。", "18. 蓄意規備公共服務，並影響他人，情節輕微。", "19. 違反試場規則，情節輕微。", "20. 性騷擾 or 性霸凌行為屬實，情節輕微。", "21. 霸凌行為屬實，情節輕微。", "22. 閱覽有害身心健康之媒體資訊或其他物品，情節輕微。", "23. 塗改點名單、請假單、成績單或其他資料。", "24. 出入禁止未滿十八歲進入之場所。", "25. 偽造、變造家長文書 or 偽造、盜用家長印章、印文 or 署押。"
            ],
            majorDemerit: [
                "1. 集體械鬥情節重大。", "2. 言行涉及公然侮辱、誹謗 or 恐嚇，情節重大。", "3. 聚集校外人士到校滋事。", "4. 勒索威脅。", "5. 故意毀損公物，情節重大。", "6. 違反著作權法，情節重大。", "7. 校內、外言行涉及學校規定 or 違反公共秩序，情節重大。", "8. 未經同意偷窺並散播他人訊息，致影響他人身心健康 or 名譽受損。", "9. 賭博行為，情節重大。", "10. 樹立幫派 or 參加不良組織。", "11. 攜帶 or 使用違法 or 禁物品，涉及公共安全且情節重大。", "12. 竊盜行為，情節重大。", "13. 違反毒品危害防制條例，經查明屬實。", "14. 吸菸、嚼檳榔、飲用酒類或其他有礙身心健康之物品，情節重大。", "15. 蓄意規避公共服務並煽動他人，嚴重影響公共事務之推動。", "16. 違反試場規則，情節重大。", "17. 性侵害、性騷擾 or 性霸凌行為屬實，情節重大。", "18. 霸凌行為屬實，情節重大。", "19. 閱覽有害身心健康之相關媒體資訊，屢勸仍再犯且情節重大。"
            ],
            special: [
                "1. 在校期間獎懲相抵後滿三大過者。", "2. 參加 or 組織不良幫派，屢勸不聽者。", "3. 故意損毀國旗者。", "4. 故意不尊敬國家元首者。", "5. 違反政府法令情節重大者。", "6. 集體械鬥 or 打傷他人情節重大者。", "7. 竊盜行為情節重大者。", "8. 反抗師長，情節重大者。", "9. 其他特別不良行為。"
            ]
        };

        function initWebAppUrl() {
            if (webappUrlInput && PRE_CONFIGURED_WEB_APP_URL && !PRE_CONFIGURED_WEB_APP_URL.includes("您的_")) {
                webappUrlInput.value = PRE_CONFIGURED_WEB_APP_URL;
                if (webappUrlContainer) {
                    webappUrlContainer.style.display = 'none';
                }
            } else {
                const savedUrl = localStorage.getItem(SAVED_URL_KEY);
                if (savedUrl && webappUrlInput) webappUrlInput.value = savedUrl;
            }
        }

        function saveWebAppUrl(url) { localStorage.setItem(SAVED_URL_KEY, url.trim()); }

        function checkGenerationVisibility() {
            const s = document.querySelectorAll('.student-block.selected').length;
            const v = document.querySelectorAll('.violation-block.selected').length;
            generationSection.classList.toggle('hidden', !(s > 0 && v > 0));
            if (s === 0 || v === 0) disableCopyButton();
        }

        async function fetchStudentData() {
            messageArea.innerHTML = '<p class="text-blue-600 font-medium">正在載入學生資料...</p>';
            try {
                const res = await fetch(`${csvUrl}&_t=${Date.now()}`);
                const text = await res.text();
                allStudentData = parseCSV(text);
                messageArea.innerHTML = `<p class="text-green-600 font-medium">載入成功 (${allStudentData.length} 筆)。</p>`;
            } catch (e) { messageArea.innerHTML = '<p class="text-red-600">載入失敗！</p>'; }
        }

        function parseCSV(text) {
            return text.split(/\r?\n/).slice(1).filter(l => l.trim()).map(l => {
                const c = l.split(',');
                return { classNum: c[0].trim(), seatNum: c[1].trim(), gender: c[3].trim() === '女' ? 'female' : 'male', name: c[4].trim() };
            });
        }

        function convertClassNumToName(id) {
            const g = {'7':'七','8':'八','9':'九'}[id[0]];
            const n = ["","一","二","三","四","五","六","七","八","九","十","十一","十二"][parseInt(id.substring(1))];
            return `${g}年${n}班`;
        }

        function showClassButtons(grade, btn) {
            classButtonsContainer.innerHTML = '';
            document.querySelectorAll('.grade-btn').forEach(b => b.classList.remove('ring-4', 'ring-offset-2'));
            if (btn) btn.classList.add('ring-4', 'ring-offset-2');
            classPlaceholder.style.display = 'none';
            for (let i = 1; i <= 12; i++) {
                const id = `${grade}${i.toString().padStart(2, '0')}`;
                const b = document.createElement('button');
                b.textContent = id; b.className = 'class-btn text-gray-800 font-semibold py-2 px-3 rounded-md shadow-sm bg-yellow-400 hover:bg-yellow-500';
                b.id = `btn-class-${id}`;
                b.onclick = () => showStudents(id, convertClassNumToName(id), b);
                classButtonsContainer.appendChild(b);
            }
        }

        function showStudents(id, name, btn) {
            studentDisplayContainer.innerHTML = '';
            document.querySelectorAll('.class-btn').forEach(b => b.classList.remove('ring-4','ring-yellow-600'));
            if (btn) btn.classList.add('ring-4','ring-yellow-600');
            const list = allStudentData.filter(s => s.classNum === name).sort((a,b) => a.seatNum - b.seatNum);
            if (list.length === 0) { messageArea.innerHTML = '找不到學生資料。'; return; }
            messageArea.innerHTML = `<p>${name} (共 ${list.length} 位)</p>`;
            list.forEach(s => {
                const d = document.createElement('div');
                d.className = `student-block p-4 rounded-lg shadow-md cursor-pointer text-center transition-all ${s.gender==='female'?'bg-pink-100 text-pink-800':'bg-green-100 text-green-800'}`;
                d.id = `student-${id}-${s.seatNum}`;
                d.innerHTML = `<span class="font-bold">${s.seatNum}-${s.name}</span>`;
                Object.assign(d.dataset, { gender: s.gender, selected: 'false', seatNum: s.seatNum, name: s.name, classId: id });
                d.onclick = () => {
                    const isS = d.dataset.selected === 'true';
                    d.dataset.selected = !isS;
                    d.classList.toggle('selected');
                    if (s.gender === 'female') {
                        d.classList.toggle('bg-pink-700'); d.classList.toggle('ring-4'); d.classList.toggle('ring-pink-300'); d.classList.toggle('ring-offset-2');
                    } else {
                        d.classList.toggle('bg-green-700'); d.classList.toggle('ring-4'); d.classList.toggle('ring-green-300'); d.classList.toggle('ring-offset-2');
                    }
                    d.classList.toggle('text-white');
                    checkGenerationVisibility();
                };
                studentDisplayContainer.appendChild(d);
            });
        }

        async function handleUrlParams() {
            const params = new URLSearchParams(window.location.search);
            const selectData = params.get('select');
            const type = params.get('type');
            const clauseNum = params.get('clause');
            urlNote = params.get('note') || "";

            if (!selectData) return;

            const items = selectData.split(',');
            const firstItem = items[0].split('-');
            const classId = firstItem[0];
            const grade = classId[0];

            const gradeBtn = document.querySelector(`.grade-btn[data-grade="${grade}"]`);
            if (gradeBtn) showClassButtons(grade, gradeBtn);

            const classBtn = document.getElementById(`btn-class-${classId}`);
            if (classBtn) {
                showStudents(classId, convertClassNumToName(classId), classBtn);
                const targetSeats = items.map(i => i.split('-')[1]);
                document.querySelectorAll('.student-block').forEach(block => {
                    if (targetSeats.includes(block.dataset.seatNum)) { block.click(); }
                });
            }

            if (type) {
                const typeBtn = document.getElementById(`btn-type-${type}`);
                if (typeBtn) {
                    showViolationClauses(type, typeBtn);
                    if (clauseNum) {
                        const clauseBlocks = document.querySelectorAll('.violation-block');
                        for (let block of clauseBlocks) {
                            if (block.dataset.clauseText.startsWith(clauseNum + ".")) { block.click(); break; }
                        }
                    }
                }
            }

            if (document.querySelectorAll('.student-block.selected').length > 0 && 
                document.querySelectorAll('.violation-block.selected').length > 0) {
                generateOutput();
            }
        }

        function showViolationClauses(cat, btn) {
            violationDisplayContainer.innerHTML = ''; violationPlaceholder.style.display = 'none';
            document.querySelectorAll('.violation-type-btn').forEach(b => b.classList.remove('ring-4','ring-offset-2'));
            btn.classList.add('ring-4','ring-offset-2');
            const colorMap = { merit:'emerald', warning:'yellow', minorDemerit:'orange', majorDemerit:'red', special:'purple' };
            const cls = colorMap[cat];
            violationData[cat].forEach(clause => {
                const d = document.createElement('div');
                d.className = `violation-block p-4 rounded-lg shadow-sm cursor-pointer transition-all bg-${cls}-100 text-${cls}-900`;
                d.innerHTML = `<span class="text-sm font-bold">${clause}</span>`;
                Object.assign(d.dataset, { type: cat, selected: 'false', clauseText: clause });
                d.onclick = () => {
                    const isS = d.dataset.selected === 'true';
                    d.dataset.selected = !isS;
                    d.classList.toggle('selected'); d.classList.toggle(`bg-${cls}-700`); d.classList.toggle('text-white');
                    d.classList.toggle('ring-4'); d.classList.toggle(`ring-${cls}-300`); d.classList.toggle('ring-offset-2');
                    checkGenerationVisibility();
                };
                violationDisplayContainer.appendChild(d);
            });
        }

        function disableCopyButton() { copyButton.disabled = true; copyButton.className = 'text-white font-bold py-3 px-6 rounded-lg bg-gray-400 cursor-not-allowed'; }
        function enableCopyButton() { copyButton.disabled = false; copyButton.className = 'text-white font-bold py-3 px-6 rounded-lg bg-green-600 hover:bg-green-700 shadow-lg transition-all'; }

        function generateOutput() {
            outputRowsContainer.innerHTML = '';
            const ss = document.querySelectorAll('.student-block.selected');
            const vs = document.querySelectorAll('.violation-block.selected');
            
            const now = new Date(); const dStr = `${now.getMonth()+1}/${now.getDate()}`;
            const map = { merit:'嘉獎', warning:'警告', minorDemerit:'小過', majorDemerit:'大過', special:'特別處罰' };
            const numMap = { merit:'7', warning:'9', minorDemerit:'10', majorDemerit:'11', special:'12' };

            const vList = Array.from(vs).map(b => {
                const t = b.dataset.clauseText; const m = t.match(/^(\d+)\./);
                return { code: `${numMap[b.dataset.type]}-${m?m[1]:'0'}`, text: t.replace(/^(\d+)\.\s*/,''), cat: b.dataset.type };
            }).sort((a,b) => a.code.localeCompare(b.code));

            const codes = vList.map(v => v.code).join(', ');
            let combinedTexts = vList.map(v => v.text).join('、');
            if (urlNote && urlNote.trim() !== "") { combinedTexts += (combinedTexts ? "、" : "") + urlNote; }
            const cat = map[vList[0].cat];

            ss.forEach(s => {
                const r = document.createElement('div'); r.className = 'output-row p-3 border-b bg-gray-50 rounded-lg space-y-2';
                const l1 = document.createElement('div'); l1.className = 'flex flex-wrap gap-2 items-center';
                
                // 基礎輸入欄位 (0-8)
                const baseFields = [
                    {val: dStr, w: 5}, 
                    {val: s.dataset.classId[0], w: 3}, 
                    {val: parseInt(s.dataset.classId.substring(1)), w: 3}, 
                    {val: now.getMonth()+1, w: 3}, 
                    {val: now.getDate(), w: 3}, 
                    {val: s.dataset.seatNum, w: 4}, 
                    {val: s.dataset.name, w: 7}, 
                    {val: cat, w: 5}, 
                    {val: codes, w: 6}
                ];

                baseFields.forEach(f => {
                    const i = document.createElement('input'); 
                    i.value = f.val; 
                    i.className = 'editable-field'; 
                    i.style.width = f.w + 'rem';
                    l1.appendChild(i);
                });

                // 數量下拉選單
                const sCount = document.createElement('select');
                sCount.className = 'editable-field';
                sCount.style.width = '4rem';
                [1, 2].forEach(v => {
                    const opt = document.createElement('option');
                    opt.value = v; opt.textContent = v;
                    sCount.appendChild(opt);
                });
                l1.appendChild(sCount);

                // 條件下拉選單
                const sCond = document.createElement('select');
                sCond.className = 'editable-field';
                sCond.style.width = '10rem';
                ['未再犯即撤消', '有改善始准予銷過'].forEach(v => {
                    const opt = document.createElement('option');
                    opt.value = v; opt.textContent = v;
                    sCond.appendChild(opt);
                });
                l1.appendChild(sCond);

                // 第二列：事由
                const l2 = document.createElement('div');
                const i2 = document.createElement('input'); 
                i2.value = combinedTexts; 
                i2.className = 'editable-field editable-reason-field';
                l2.appendChild(i2);
                
                r.appendChild(l1); 
                r.appendChild(l2); 
                outputRowsContainer.appendChild(r);
            });
            outputMessage.textContent = `已產生 ${ss.length} 筆資料。請點擊「同步」完成處理。`; enableCopyButton();
        }

        async function copyAndSendToSheet() {
            const rows = document.querySelectorAll('.output-row');
            const url = webappUrlInput.value.trim();
            const copyD = [], sendD = [];
            
            rows.forEach(r => {
                const inputs = Array.from(r.querySelectorAll('input'));
                const selects = Array.from(r.querySelectorAll('select'));
                
                const v = inputs.map(i => i.value);
                const s = selects.map(sel => sel.value);
                
                // 更新後的傳送順序：
                // v[0]:日期, v[1]:年, v[2]:班, v[3]:月, v[4]:日, v[5]:座號, v[6]:姓名, 
                // v[7]:種類, v[8]:條款, v[9]:事由, s[0]:數量, s[1]:條件
                
                // 依照要求重新排序：
                // 索引 7: 事由 (v[9])
                // 索引 8: 種類 (v[7])
                // 索引 9: 條款 (v[8])
                // 索引 10: 數量 (s[0])
                // 索引 11: 條件 (s[1])
                const finalRow = [
                    v[0], v[1], v[2], v[3], v[4], v[5], v[6], // 0-6
                    v[9], // 7: 事由
                    v[7], // 8: 獎懲種類
                    v[8], // 9: 依據條款
                    s[0], // 10: 獎懲數
                    s[1]  // 11: 銷過條件
                ];

                copyD.push(finalRow.join('\t')); 
                sendD.push(finalRow);
            });

            const ta = document.createElement('textarea'); ta.value = copyD.join('\n'); document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
            
            if (url && !url.includes("您的_")) {
                outputMessage.innerHTML = '<span class="spinner"></span> 正在傳送至 Google 雲端進行寫入與產生文件...';
                try {
                    await fetch(url, { method: 'POST', mode: 'no-cors', body: JSON.stringify(sendD) });
                    setTimeout(() => {
                        outputMessage.innerHTML = '✅ <span class="text-green-600">同步請求已發送！請檢查試算表與雲端資料夾。</span>';
                        outputMessage.className = 'font-bold mt-2';
                    }, 1500);
                } catch (e) {
                    outputMessage.textContent = '❌ 同步失敗，僅完成剪貼簿複製。';
                }
            } else {
                outputMessage.textContent = '⚠️ 尚未設定 Web App 網址，僅完成剪貼簿複製。';
            }
        }

        window.onload = async () => { 
            await fetchStudentData(); 
            initWebAppUrl(); 
            handleUrlParams(); 
        };
    </script>
</body>
</html>
